<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VPlay Mock Host — Neon Harbor</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#0b0d14; color:#e2e8f0; display:flex; flex-direction:column; height:100vh; }
  header { padding:8px 14px; background:#111827; display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #1f2937; }
  header b { color:#b9ff43; }
  header .bal { color:#fbbf24; }
  header button { background:#1f2937; color:#e2e8f0; border:1px solid #374151; border-radius:6px; padding:5px 12px; cursor:pointer; }
  header button:hover { border-color:#b9ff43; }
  main { flex:1; display:flex; min-height:0; }
  iframe { flex:1; border:0; background:#000; }
  aside { width:320px; border-left:1px solid #1f2937; display:flex; flex-direction:column; min-height:0; }
  aside h3 { margin:8px 12px 4px; font-size:12px; text-transform:uppercase; letter-spacing:.15em; color:#94a3b8; }
  #log { flex:1; overflow:auto; font:11px/1.5 ui-monospace, monospace; padding:0 12px 12px; white-space:pre-wrap; word-break:break-all; }
  .msg-in { color:#7dd3fc; } .msg-out { color:#c4b5fd; } .evt { color:#fbbf24; }
</style>
</head>
<body>
<header>
  <b>VPLAY MOCK HOST</b>
  <span>Tester (signed in)</span>
  <span class="bal">◈ <span id="vcoins">5000</span> VCoins</span>
  <button onclick="sendEvt('pause')">pause</button>
  <button onclick="sendEvt('resume')">resume</button>
  <button onclick="sendEvt('mute')">mute</button>
  <button onclick="sendEvt('unmute')">unmute</button>
  <label style="font-size:12px;color:#94a3b8"><input type="checkbox" id="forceInsuff"> force insufficient</label>
</header>
<main>
  <iframe id="game" src="/"></iframe>
  <aside>
    <h3>Message log</h3>
    <div id="log"></div>
  </aside>
</main>
<script>
// ---- Mock vplay.gg host: prices, wallet, entitlements, protocol ----
const PRICES = {
  'skin.amber': 150, 'skin.blue': 250, 'skin.white': 250, 'skin.viper': 400,
  'skin.ghost': 1000, 'skin.royal': 1000, 'skin.solar': 1700, 'skin.oni': 1700,
  'theme.golden': 600, 'theme.acid': 1700, 'theme.sakura': 1700, 'pass.harbor': 3500,
}
const PASS_ITEMS = ['skin.ghost','skin.royal','skin.solar','skin.oni','theme.acid','theme.sakura']
const state = { vcoins: 5000, entitlements: [], milestones: [] }
const gameFrame = document.getElementById('game')
const GAME_ORIGIN = new URL(gameFrame.src).origin
const logEl = document.getElementById('log')

function log(cls, text) {
  const d = document.createElement('div')
  d.className = cls
  d.textContent = text
  logEl.appendChild(d)
  logEl.scrollTop = logEl.scrollHeight
}
function render() { document.getElementById('vcoins').textContent = state.vcoins }
function owns(id) { return state.entitlements.includes(id) || (id === 'pass.harbor' && false) }
function reply(id, ok, result, error) {
  const msg = { __vplay: 1, kind: 'res', id, ok }
  if (ok) msg.result = result; else msg.error = error
  log('msg-out', '→ ' + JSON.stringify(msg))
  gameFrame.contentWindow.postMessage(msg, GAME_ORIGIN)
}
function sendEvt(name, data) {
  const msg = { __vplay: 1, kind: 'evt', name, data }
  log('evt', '→ EVENT ' + name)
  gameFrame.contentWindow.postMessage(msg, GAME_ORIGIN)
}

window.addEventListener('message', (event) => {
  if (event.source !== gameFrame.contentWindow) return
  const d = event.data
  if (!d || d.__vplay !== 1) return
  log('msg-in', '← ' + JSON.stringify(d))
  if (d.kind !== 'req') return

  switch (d.method) {
    case 'init':
      reply(d.id, true, {
        player: { signedIn: true, displayName: 'Tester', member: true },
        vcoins: state.vcoins,
        items: Object.entries(PRICES).map(([id, priceVc]) => ({ id, priceVc, owned: state.entitlements.includes(id) })),
        entitlements: [...state.entitlements],
        save: null,
      })
      break
    case 'loading':
      log('msg-in', '   loading ' + (d.params.progress * 100 | 0) + '%')
      reply(d.id, true, null)
      break
    case 'gameplayStart': case 'gameplayStop':
      reply(d.id, true, null)
      break
    case 'purchase': {
      const id = d.params.itemId
      if (!(id in PRICES)) { reply(d.id, false, null, { code: 'unknown_item', message: id }); break }
      if (state.entitlements.includes(id)) { reply(d.id, true, { status: 'purchased', entitlements: [...state.entitlements], vcoins: state.vcoins }); break }
      if (!confirm('Buy ' + id + ' for ' + PRICES[id] + ' VCoins?\nBalance: ' + state.vcoins)) {
        reply(d.id, true, { status: 'cancelled' }); break
      }
      if (document.getElementById('forceInsuff').checked || state.vcoins < PRICES[id]) {
        reply(d.id, true, { status: 'insufficient', message: 'Not enough VCoins' }); break
      }
      state.vcoins -= PRICES[id]
      state.entitlements.push(id)
      if (id === 'pass.harbor') {
        for (const p of PASS_ITEMS) if (!state.entitlements.includes(p)) state.entitlements.push(p)
      }
      render()
      log('evt', '→ EVENT entitlements (purchase)')
      gameFrame.contentWindow.postMessage({ __vplay: 1, kind: 'evt', name: 'entitlements', data: { entitlements: [...state.entitlements] } }, GAME_ORIGIN)
      reply(d.id, true, { status: 'purchased', entitlements: [...state.entitlements], vcoins: state.vcoins })
      break
    }
    case 'entitlements':
      reply(d.id, true, { entitlements: [...state.entitlements] })
      break
    case 'saveCloud':
      log('msg-in', '   saveCloud ' + JSON.stringify(d.params.data).length + ' bytes')
      reply(d.id, true, null)
      break
    case 'milestone': {
      const id = d.params.id
      if (!state.milestones.includes(id)) {
        state.milestones.push(id)
        log('evt', '★ milestone: ' + id)
      }
      reply(d.id, true, null)
      break
    }
    default:
      reply(d.id, false, null, { code: 'unknown_method', message: d.method })
  }
})
render()
</script>
</body>
</html>
